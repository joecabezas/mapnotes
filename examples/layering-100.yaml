properties:
  - key: title
    value: Layering test
  - key: subtitle
    value: 100 nodes · roadmap → epics → features → tickets → PRs, with cross-links
styles:
  - id: root
    target: node
    name: Roadmap
    color: '#e0af68'
    borderColor: '#b3862f'
    shape: star
    size: 56
