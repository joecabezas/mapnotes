    color: '#ffffff'
    borderColor: '#5e6ad2'
    shape: ellipse
    size: 40
    icon: linear
  - id: pr
    target: node
    name: Pull request
    color: '#ffffff'
    borderColor: '#24292f'
    shape: ellipse
    size: 40
    icon: github_light
  - id: slack
    target: node
    name: Slack thread
    color: '#ffffff'
    borderColor: '#4a154b'
    shape: ellipse
    size: 40
    icon: slack
  - id: obsidian
    target: node
    name: Obsidian note
    color: '#ffffff'
    borderColor: '#7c3aed'
    shape: ellipse
    size: 40
    icon: obsidian
