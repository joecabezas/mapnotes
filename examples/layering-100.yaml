properties:
  - key: title
    value: Layering test
  - key: subtitle
    value: 100 nodes · roadmap → epics → features → tickets → PRs, with cross-links
styles:
  - id: root
    target: node
    name: Roadmap
    color: '#e0af68'
    borderColor: '#b3862f'
    shape: star
    size: 56
  - id: epic
    target: node
    name: Epic
    color: '#bb9af7'
    borderColor: '#7c5fc4'
    shape: round-rectangle
    size: 46
  - id: feature
    target: node
    name: Feature
    color: '#7aa2f7'
    borderColor: '#3d59a1'
    shape: round-rectangle
    size: 38
    icon: lucide:user-round
  - id: linear
    target: node
    name: Linear ticket
    color: '#ffffff'
    borderColor: '#5e6ad2'
    shape: ellipse
    size: 40
    icon: linear
  - id: pr
    target: node
    name: Pull request
    color: '#ffffff'
    borderColor: '#24292f'
    shape: ellipse
    size: 40
    icon: github_light
  - id: slack
    target: node
    name: Slack thread
    color: '#ffffff'
    borderColor: '#4a154b'
    shape: ellipse
    size: 40
    icon: slack
  - id: obsidian
    target: node
    name: Obsidian note
    color: '#ffffff'
    borderColor: '#7c3aed'
    shape: ellipse
    size: 40
    icon: obsidian
  - id: blocks
    target: edge
    name: Blocks
    color: '#f7768e'
    lineStyle: dashed
